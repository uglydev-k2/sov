function update(now){if(playing){position=Math.min(4100,position+now-previous);playing=position<4100}previous=now;slider.value=position;frame(now);if(playing||blooms.some(f=>now-f.tap<900))animation=requestAnimationFrame(update)}
function refresh(){cancelAnimationFrame(animation);previous=performance.now();update(previous)}
let drag=null;
canvas.onpointerdown=e=>{if(!e.isPrimary||e.button!==0)return;canvas.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,angle:yaw,moved:false}};
canvas.onpointermove=e=>{if(!drag||!e.isPrimary)return;const dx=e.clientX-drag.x;if(Math.hypot(dx,e.clientY-drag.y)>4)drag.moved=true;if(drag.moved){yaw=drag.angle+dx*5/canvas.clientWidth;refresh()}};
canvas.onpointerup=e=>{if(!e.isPrimary||!drag)return;if(!drag.moved){const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*700/r.width,y=(e.clientY-r.top)*800/r.height;const h=hits.slice().sort((a,b)=>b.d-a.d).find(h=>Math.hypot(h.x-x,h.y-y)<h.r);if(h)blooms[h.i].tap=performance.now()}drag=null;refresh()};
canvas.onlostpointercapture=()=>drag=null;
canvas.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();yaw+=e.key==='ArrowLeft'?-.16:.16}else if(e.key==='Enter'){position=4100;blooms[selection++%blooms.length].tap=performance.now()}else return;refresh()};
slider.oninput=()=>{playing=false;position=Number(slider.value);refresh()};
document.querySelector('button').onclick=()=>{position=0;playing=true;refresh()};
Promise.all(sprites.map(image=>image.decode())).then(()=>{
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 position=reduced?4100:0;playing=!reduced;refresh();
});
</script></html>
